worker_processes 1;
events { worker_connections 2048; }
http {
    access_log off;
    server {
        listen 8000;
        # Synthetic fixture API: every positive, at-most-12-digit product ID exists.
        # The ID changes the response, so the test checks real path forwarding.
        location ~ "^/products/(?<product_id>[1-9][0-9]{0,11})$" {
            if ($args != "") { return 400; }
            default_type application/json;
            return 200 '{"service":"benchmark-backend","ok":true,"product":{"id":$product_id,"name":"Example","price":100}}';
        }
        location / { return 404; }
    }
}

