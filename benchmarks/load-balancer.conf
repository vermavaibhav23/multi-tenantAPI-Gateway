worker_processes 1;
events { worker_connections 2048; }
http {
    access_log off;
    upstream benchmark_gateways {
        server gateway-1:8000;
        server gateway-2:8000;
        server gateway-3:8000;
    }
    server {
        listen 8000;
        location = /healthz { return 200 'ready'; }
        location / {
            proxy_pass http://benchmark_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Do not hide a gateway failure by retrying against another instance.
            proxy_next_upstream off;
            add_header X-Benchmark-Upstream $upstream_addr always;
        }
    }
}
