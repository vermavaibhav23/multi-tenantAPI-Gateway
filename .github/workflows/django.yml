name: Django checks
on:
  push:
    branches: [main, schema/route-method-policies-final, feat/application-client-jwt-auth]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django configuration
        env:
          USE_SQLITE: 'True'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Unit and integration tests
        env:
          USE_SQLITE: 'True'
        run: python manage.py test authentication users routes gateway analytics
