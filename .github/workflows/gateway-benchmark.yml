name: Gateway four-topology benchmark
on:
  workflow_dispatch:
  push:
    branches: [codex/isolated-gateway-benchmark]
    paths: ['benchmarks/**', '.github/workflows/gateway-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: gateway-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt PyYAML==6.0.2
      - name: Check isolated configurations and production settings
        run: |
          python -m unittest benchmarks.test_config benchmarks.test_measurement -v
          python -m benchmarks.compose
          for config in benchmarks/generated/*/compose.json; do
            docker compose --project-directory . -f "$config" config --quiet
          done
      - name: Verify backend contract and three upstreams with lightweight stand-ins
        run: python -m benchmarks.smoke
  compare:
    # Full experiments require manual dispatch or an explicit opt-in commit.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-benchmark]') || contains(github.event.head_commit.message, '[check-replicas]') || contains(github.event.head_commit.message, '[run-stress]')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Run four topologies sequentially on the same runner
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-benchmark]')
        run: python -m benchmarks.run
      - name: Check replica startup and short real-gateway load
        if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[check-replicas]') && !contains(github.event.head_commit.message, '[run-benchmark]')
        run: python -m benchmarks.run --cases mysql-replicas combined --rates 10 --duration 5 --repeats 1
      - name: Stress all four topologies and check recovery
        if: github.event_name != 'workflow_dispatch' && contains(github.event.head_commit.message, '[run-stress]')
        run: python -m benchmarks.run --rates 100 200 400 800 1000 --duration 60 --repeats 1 --vus 300 --recovery-rate 100
      - name: Upload measurements and diagnostics (never tenant credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-four-topology-results
          path: benchmarks/results/
          retention-days: 14
          if-no-files-found: warn

