x-gateway-env: &gateway-env
  USE_SQLITE: "False"
  MYSQL_HOST: mysql-router
  MYSQL_PORT: "6446"
  MYSQL_READ_PORT: "6447"
  MYSQL_CLUSTER_ENABLED: "True"
  MYSQL_DATABASE: "${MYSQL_DATABASE:-gateway_db}"
  MYSQL_USER: "${MYSQL_USER:-gateway}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD:-gateway}"
  REDIS_CLUSTER_ENABLED: "True"
  REDIS_CLUSTER_URL: redis://redis-node-1:6379
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-secret-key-change-me}"
  CLIENT_JWT_SIGNING_KEY: "${CLIENT_JWT_SIGNING_KEY:-}"
  GATEWAY_CACHEABLE_BACKEND_HOSTS: "${GATEWAY_CACHEABLE_BACKEND_HOSTS-fashion-user-service,fashion-product-service,fashion-order-service}"
  GATEWAY_ALLOWED_BACKEND_ORIGINS: "${GATEWAY_ALLOWED_BACKEND_ORIGINS-http://fashion-user-service:8000,http://fashion-product-service:8000,http://fashion-order-service:8000,http://banking-user-service:8000,http://banking-account-service:8000,http://banking-payment-service:8000,http://healthcare-doctor-service:8000,http://healthcare-appointment-service:8000,http://healthcare-patient-service:8000,http://banking-transaction-service:8000}"

x-gateway-base: &gateway-base
  build: .
  environment: *gateway-env
  depends_on:
    mysql-router:
      condition: service_started
    redis-cluster-init:
      condition: service_completed_successfully
  networks:
    - default
    - redis-cluster

# The six nodes run on the same internal port because they have independent IPs.
# Docker service names are advertised to cluster-aware clients inside Docker.
x-redis-node: &redis-node
  image: redis:7-alpine
  networks:
    - redis-cluster
  command: >
    sh -c 'exec redis-server
    --port 6379
    --protected-mode no
    --cluster-enabled yes
    --cluster-config-file /data/nodes.conf
    --cluster-node-timeout 5000
    --cluster-announce-hostname "$$REDIS_NODE_NAME"
    --cluster-preferred-endpoint-type hostname
    --appendonly yes'
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "6379", "ping"]
    interval: 3s
    timeout: 2s
    retries: 30
  restart: unless-stopped

# Group Replication requirements shared by every MySQL instance.
x-mysql-node-env: &mysql-node-env
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
  MYSQL_ROOT_HOST: "%"

x-mysql-node: &mysql-node
  image: mysql:8.0
  environment: *mysql-node-env
  command: ["mysqld"]
  restart: unless-stopped
  # Group Replication needs GTIDs and row-based binary logging on every node.
  # Each node uses 3306 for SQL and 33061 for XCom (internal only).
  volumes: []
  networks:
    - default
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 3s
    retries: 45
    start_period: 20s

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - api-gateway-3

  api-gateway-migrate:
    <<: *gateway-base
    # Router starts after cluster bootstrap, but allow time for its first listener.
  command: >
    sh -c 'i=0; until python manage.py migrate; do
      i=$((i+1)); if [ "$i" -ge 30 ]; then exit 1; fi;
      sleep 3; done'

  api-gateway-1:
    <<: *gateway-base
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    depends_on:
      api-gateway-migrate:
        condition: service_completed_successfully

  api-gateway-2:
    <<: *gateway-base
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    depends_on:
      api-gateway-migrate:
        condition: service_completed_successfully

  api-gateway-3:
    <<: *gateway-base
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    depends_on:
      api-gateway-migrate:
        condition: service_completed_successfully

  fashion-user-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: fashion-user-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  fashion-product-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: fashion-product-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  fashion-order-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: fashion-order-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  banking-user-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: banking-user-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  banking-account-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: banking-account-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  banking-payment-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: banking-payment-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  healthcare-doctor-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: healthcare-doctor-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  healthcare-appointment-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: healthcare-appointment-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  healthcare-patient-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: healthcare-patient-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  banking-transaction-service:
    build: .
    command: python dummy_backend/server.py
    environment:
      BACKEND_SERVICE_NAME: banking-transaction-service
      BACKEND_PORT: "8000"
    expose:
      - "8000"

  # Three independent data directories. Do NOT mount the old mysql_data volume
  # into a GR node: migrate existing installations from a verified SQL backup.
  mysql-1:
    <<: *mysql-node
    command: ["mysqld", "--server-id=1", "--report-host=mysql-1", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--binlog-format=ROW", "--log-replica-updates=ON", "--group-replication-consistency=BEFORE_AND_AFTER"]
    environment:
      <<: *mysql-node-env
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gateway_db}"
      MYSQL_USER: "${MYSQL_USER:-gateway}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-gateway}"
    volumes:
      - mysql_1_data:/var/lib/mysql

  mysql-2:
    <<: *mysql-node
    command: ["mysqld", "--server-id=2", "--report-host=mysql-2", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--binlog-format=ROW", "--log-replica-updates=ON", "--group-replication-consistency=BEFORE_AND_AFTER"]
    volumes:
      - mysql_2_data:/var/lib/mysql

  mysql-3:
    <<: *mysql-node
    command: ["mysqld", "--server-id=3", "--report-host=mysql-3", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--binlog-format=ROW", "--log-replica-updates=ON", "--group-replication-consistency=BEFORE_AND_AFTER"]
    volumes:
      - mysql_3_data:/var/lib/mysql

  mysql-cluster-init:
    # Oracle's community-server image bundles MySQL Shell (mysqlsh).
    image: container-registry.oracle.com/mysql/community-server:8.0
    entrypoint: ["mysqlsh", "--js", "--file=/cluster/bootstrap.js"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - ./mysql/bootstrap.js:/cluster/bootstrap.js:ro
    depends_on:
      mysql-1:
        condition: service_healthy
      mysql-2:
        condition: service_healthy
      mysql-3:
        condition: service_healthy
    restart: "no"

  mysql-router:
    image: mysql/mysql-router:8.0
    environment:
      MYSQL_HOST: mysql-1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_INNODB_CLUSTER_MEMBERS: "3"
    depends_on:
      mysql-cluster-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redis-node-1:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-1
    volumes:
      - redis_node_1_data:/data

  redis-node-2:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-2
    volumes:
      - redis_node_2_data:/data

  redis-node-3:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-3
    volumes:
      - redis_node_3_data:/data

  redis-node-4:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-4
    volumes:
      - redis_node_4_data:/data

  redis-node-5:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-5
    volumes:
      - redis_node_5_data:/data

  redis-node-6:
    <<: *redis-node
    environment:
      REDIS_NODE_NAME: redis-node-6
    volumes:
      - redis_node_6_data:/data

  # One-shot, idempotent bootstrap: allocate 16,384 hash slots, 3 primaries and 3 replicas.
  redis-cluster-init:
    image: redis:7-alpine
    networks:
      - redis-cluster
    volumes:
      - ./redis/cluster-init.sh:/cluster-init.sh:ro
    entrypoint: ["/bin/sh", "/cluster-init.sh"]
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    restart: "no"

volumes:
  # Former mysql_data volumes are intentionally NOT deleted by this upgrade.
  mysql_data:
  mysql_1_data:
  mysql_2_data:
  mysql_3_data:
  redis_node_1_data:
  redis_node_2_data:
  redis_node_3_data:
  redis_node_4_data:
  redis_node_5_data:
  redis_node_6_data:

networks:
  redis-cluster:
    internal: true
